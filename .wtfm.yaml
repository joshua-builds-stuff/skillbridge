project:
  name: skillbridge
  type: library

execution_policy:
  trust: trusted-local
  network: none
  env_allowlist: [PATH, LANG, NPM_CONFIG_CACHE, TMPDIR]
  secret_names: []

verify:
  commands:
    - id: install
      run: [npm, ci, --offline, --ignore-scripts, --no-audit, --no-fund]
      cwd: .
      timeout_s: 180
      expect_exit: 0
      requires_env: []
      optional: false
    - id: typecheck
      run: [npm, run, typecheck]
      cwd: .
      timeout_s: 120
      expect_exit: 0
      requires_env: []
      optional: false
    - id: tests
      run: [npm, test]
      cwd: .
      timeout_s: 120
      expect_exit: 0
      requires_env: []
      optional: false
    - id: build
      run: [npm, run, build]
      cwd: .
      timeout_s: 120
      expect_exit: 0
      requires_env: []
      optional: false
    - id: entrypoint
      run: [npm, run, "test:entrypoint"]
      cwd: .
      timeout_s: 60
      expect_exit: 0
      requires_env: []
      optional: false
    - id: package
      run: [npm, pack, --dry-run]
      cwd: .
      timeout_s: 120
      expect_exit: 0
      requires_env: []
      optional: false

doc:
  output: README.md
  preserve: ["## Why the plugin uses Executor's API"]
